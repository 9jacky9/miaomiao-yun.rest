<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6D5C1" />
      <stop offset="55%" stop-color="#FBE9D7" />
      <stop offset="100%" stop-color="#FAF6F0" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262320" />
      <stop offset="100%" stop-color="#3B3530" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E06D53" />
      <stop offset="100%" stop-color="#D99B26" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A7C59" />
      <stop offset="100%" stop-color="#6FA07E" />
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="60" y="36" width="520" height="270" rx="28" />
    </clipPath>
  </defs>

  <!-- Warm Lounge Background -->
  <rect width="640" height="480" rx="24" fill="#FAF6F0" />

  <!-- Panoramic Nordic Window Frame -->
  <rect x="52" y="28" width="536" height="286" rx="34" fill="#E5DDD0" />
  <g clip-path="url(#windowClip)">
    <rect x="60" y="36" width="520" height="270" fill="url(#sunsetSky)" />

    <!-- Warm Setting Sun -->
    <circle cx="460" cy="135" r="46" fill="#E06D53" opacity="0.28">
      <animate attributeName="r" values="44;50;44" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="460" cy="135" r="32" fill="#D99B26" opacity="0.45" />

    <!-- Drifting Cloud Layer 1 (Back) -->
    <g opacity="0.75">
      <path d="M90 190 Q115 165 145 178 Q175 152 210 175 Q235 168 250 190 Z" fill="#FFFFFF" />
      <path d="M340 120 Q365 98 395 110 Q420 92 450 115 Z" fill="#FFFFFF" />
      <animateTransform attributeName="transform" type="translate" values="-30,0; 35,0; -30,0" dur="14s" repeatCount="indefinite" />
    </g>

    <!-- Drifting Cloud Layer 2 (Front Soft Cushion Clouds) -->
    <g opacity="0.92">
      <path d="M40 265 Q85 220 140 242 Q195 205 260 238 Q315 215 365 248 Q425 220 485 245 Q540 225 600 265 L600 310 L40 310 Z" fill="#FFFFFF" />
      <animateTransform attributeName="transform" type="translate" values="20,0; -25,0; 20,0" dur="10s" repeatCount="indefinite" />
    </g>

    <!-- Window Mullions (Subtle Wood Frame Dividers) -->
    <line x1="230" y1="36" x2="230" y2="306" stroke="#E5DDD0" stroke-width="5" />
    <line x1="410" y1="36" x2="410" y2="306" stroke="#E5DDD0" stroke-width="5" />
  </g>

  <!-- Cozy Lounge Console & Sofa Silhouette -->
  <rect x="40" y="340" width="560" height="110" rx="22" fill="#F2ECE1" stroke="#E5DDD0" stroke-width="2" />
  <rect x="85" y="365" width="470" height="14" rx="7" fill="#E5DDD0" />

  <!-- Home Cinema Floating Screen -->
  <g transform="translate(155, 130)">
    <rect x="0" y="0" width="330" height="195" rx="20" fill="url(#screenGlow)" stroke="#FFFFFF" stroke-width="5" />
    <!-- Screen Header Dots -->
    <circle cx="24" cy="22" r="5" fill="#E06D53" />
    <circle cx="40" cy="22" r="5" fill="#D99B26" />
    <circle cx="56" cy="22" r="5" fill="#4A7C59" />
    <text x="235" y="26" fill="#FAF6F0" font-family="sans-serif" font-size="11" font-weight="bold" opacity="0.85">4K HDR · 0ms</text>

    <!-- Animated Cinema Wave & Play Symbol -->
    <circle cx="165" cy="96" r="34" fill="#E06D53" opacity="0.2">
      <animate attributeName="r" values="30;44;30" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="165" cy="96" r="24" fill="url(#coralGrad)" />
    <polygon points="159,85 159,107 177,96" fill="#FFFFFF" />

    <!-- Animated Soundbars / Bitrate Stream Bars -->
    <rect x="52" y="148" width="226" height="6" rx="3" fill="#5C554E" />
    <rect x="52" y="148" width="160" height="6" rx="3" fill="#E06D53">
      <animate attributeName="width" values="60;215;160;226;60" dur="7s" repeatCount="indefinite" />
    </rect>

    <!-- Audio Visualizer Bars -->
    <g fill="#4A7C59" opacity="0.9">
      <rect x="65" y="92" width="6" height="20" rx="3">
        <animate attributeName="height" values="12;28;12" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="96;88;96" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="79" y="86" width="6" height="32" rx="3">
        <animate attributeName="height" values="32;14;32" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="86;95;86" dur="1.5s" repeatCount="indefinite" />
      </rect>
      <rect x="93" y="90" width="6" height="24" rx="3">
        <animate attributeName="height" values="16;34;16" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="94;85;94" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="235" y="90" width="6" height="24" rx="3">
        <animate attributeName="height" values="28;12;28" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="88;96;88" dur="1.3s" repeatCount="indefinite" />
      </rect>
      <rect x="249" y="86" width="6" height="32" rx="3">
        <animate attributeName="height" values="14;32;14" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="95;86;95" dur="1.4s" repeatCount="indefinite" />
      </rect>
      <rect x="263" y="92" width="6" height="20" rx="3">
        <animate attributeName="height" values="24;10;24" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="90;97;90" dur="1.2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Floating Media Orb 1: 4K Ultra HD -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="4s" repeatCount="indefinite" />
    <rect x="58" y="105" width="110" height="46" rx="23" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="2" />
    <circle cx="84" cy="128" r="14" fill="#E06D53" opacity="0.18" />
    <circle cx="84" cy="128" r="7" fill="#E06D53" />
    <text x="104" y="133" fill="#262320" font-family="sans-serif" font-size="13" font-weight="bold">4K 秒开</text>
  </g>

  <!-- Floating Media Orb 2: AI Inspiration -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,14; 0,0" dur="4.8s" repeatCount="indefinite" />
    <rect x="468" y="92" width="122" height="46" rx="23" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="2" />
    <circle cx="494" cy="115" r="14" fill="#4A7C59" opacity="0.18" />
    <path d="M494 106 L496 113 L503 115 L496 117 L494 124 L492 117 L485 115 L492 113 Z" fill="#4A7C59" />
    <text x="514" y="120" fill="#262320" font-family="sans-serif" font-size="13" font-weight="bold">灵感 AI</text>
  </g>

  <!-- Floating Media Orb 3: Lossless Music & Reading -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="3.6s" repeatCount="indefinite" />
    <rect x="472" y="242" width="118" height="44" rx="22" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="2" />
    <circle cx="497" cy="264" r="13" fill="#D99B26" opacity="0.22" />
    <circle cx="497" cy="264" r="6" fill="#D99B26" />
    <text x="516" y="269" fill="#262320" font-family="sans-serif" font-size="12" font-weight="bold">云端慢读</text>
  </g>

  <!-- Cozy Coffee Mug with Rising Steam on Left Console -->
  <g transform="translate(88, 308)">
    <!-- Rising Steam Wisps -->
    <path d="M18 -6 Q12 -18 20 -28 Q26 -38 18 -48" fill="none" stroke="#E06D53" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.75;0.2" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M32 -4 Q38 -16 30 -26 Q24 -36 32 -46" fill="none" stroke="#D99B26" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.4s" repeatCount="indefinite" />
    </path>
    <!-- Mug Body -->
    <rect x="8" y="2" width="38" height="44" rx="10" fill="#E06D53" />
    <path d="M46 12 Q58 12 58 24 Q58 36 46 36" fill="none" stroke="#E06D53" stroke-width="5" stroke-linecap="round" />
    <rect x="4" y="44" width="46" height="6" rx="3" fill="#262320" opacity="0.2" />
  </g>

  <!-- Eucalyptus Plant Pot on Right Console -->
  <g transform="translate(505, 298)">
    <path d="M22 50 Q8 26 14 6 Q26 18 22 50" fill="#4A7C59" />
    <path d="M26 50 Q42 22 36 2 Q22 18 26 50" fill="#6FA07E" />
    <rect x="10" y="44" width="28" height="28" rx="6" fill="#D99B26" />
  </g>

  <!-- Bottom Lounge Status Pill -->
  <rect x="195" y="396" width="250" height="36" rx="18" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5" />
  <circle cx="218" cy="414" r="6" fill="#4A7C59">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="234" y="419" fill="#262320" font-family="sans-serif" font-size="12.5" font-weight="bold">秒秒云专线已连接 · 自在小憩中</text>
</svg>
